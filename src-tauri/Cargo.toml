[package]
name = "livetools-desktop"
version = "0.1.1"
description = "LiveTools Desktop: lettore di sequenze multitraccia e video per il live"
edition = "2021"

[lib]
name = "livetools_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"
parking_lot = "0.12"
ureq = { version = "2", features = ["json"] }
url = "2"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Bluetooth devices connected (page-turner pedals), see bluetooth.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Bluetooth", "Devices_Enumeration", "Foundation_Collections"] }

# Decoding and mixing must keep up in real time even in debug builds.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
