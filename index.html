<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>LiveTools</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Splash: inline so it paints before the bundle loads; main.jsx removes it. -->
    <style>
      html,
      body {
        background: #0b0f17;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: radial-gradient(ellipse at 50% 45%, #161d2b 0%, #0b0f17 70%);
        transition: opacity 400ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      #splash.is-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: min(360px, 50vw);
        animation: splash-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash .splash-tagline {
        margin: 0;
        min-height: 1.5em;
        font: 600 16px 'Inter', system-ui, 'Segoe UI', sans-serif;
        letter-spacing: 0.04em;
        color: #cbd5e1;
        animation: splash-in 700ms 150ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #splash .splash-tagline:empty {
        display: none;
      }
      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img,
        #splash .splash-tagline {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <img src="/brand/logo-full.png" alt="" />
      <!-- Slogan: fill in when ready. -->
      <p class="splash-tagline"></p>
    </div>
    <script>
      // Output windows (video, prompter) open on their own content, no splash.
      if (new URLSearchParams(location.search).get('view')) document.getElementById('splash').remove();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
